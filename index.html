<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Taydle</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Taydle #X: Click To Play</h1>
            <h4>Guess the song and album as quickly as possible.</h4>
            <div class="progress-container">
                <div class="progress-text"></div>
                <div class="progress-bar"></div>
            </div>
            <div>
                <div class="time-text">Total time: 0 seconds</div>
                <button id="playButton" class="button">Paused</button>
                <button id="restartButton" class="button">Restart Song</button>
            </div>

            <input type="text" id="guessSongInput" placeholder="Guess the song..." />
            <input type="text" id="guessAlbumInput" placeholder="Guess the album..." />
            <div id="suggestions" class="suggest-dropdown"></div>

            <div>
                <button onclick="submitGuess()" id="guessButton" class="button">Guess</button
                ><button onclick="giveUp()" id="surrenderButton" class="button">Give Up</button>
            </div>

            <p id="message"></p>
            <p onclick="copyScore()" id="score"></p>
        </div>
        <script src="taydle.js"></script>
    </body>
</html>
